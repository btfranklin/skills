[project]
name = "skills-repository-checks"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
test = ["pydantic>=2.13.5"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
test = "python -m unittest discover -s tests -v"
validate = "python scripts/validate_repository.py"
docs = "perfect-doc check . --offline --no-banner"
check = { composite = ["validate", "test", "docs"] }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Design UI Style Guide</title>
  <desc id="desc">Three UI concept sparks converging into a polished style guide canvas.</desc>
  <defs>
    <linearGradient id="bg" x1="38" y1="32" x2="474" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.42" stop-color="#164e63"/>
      <stop offset="0.7" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(130 118) rotate(45) scale(330)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#67e8f9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canvas" x1="122" y1="118" x2="408" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="laneA" x1="92" y1="98" x2="184" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="laneB" x1="210" y1="70" x2="302" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="laneC" x1="330" y1="98" x2="426" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#glow)"/>
  <path d="M72 398 C142 346 196 340 256 374 C318 408 382 388 450 318" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.16"/>
  <path d="M88 418 C154 374 206 370 256 400 C314 434 380 418 430 374" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.12"/>

  <g filter="url(#softShadow)">
    <rect x="92" y="94" width="92" height="92" rx="24" fill="url(#laneA)"/>
    <rect x="210" y="66" width="92" height="92" rx="24" fill="url(#laneB)"/>
    <rect x="328" y="94" width="92" height="92" rx="24" fill="url(#laneC)"/>
  </g>

  <path d="M138 198 C154 234 188 248 220 262" fill="none" stroke="#e0f2fe" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <path d="M256 170 L256 246" fill="none" stroke="#e0f2fe" stroke-width="14" stroke-linecap="round" opacity="0.92"/>
  <path d="M374 198 C358 234 324 248 292 262" fill="none" stroke="#e0f2fe" stroke-width="14" stroke-linecap="round" opacity="0.92"/>

  <g filter="url(#softShadow)">
    <rect x="112" y="242" width="288" height="168" rx="28" fill="url(#canvas)"/>
    <rect x="136" y="270" width="78" height="18" rx="9" fill="#0f172a"/>
    <rect x="230" y="270" width="54" height="18" rx="9" fill="#14b8a6"/>
    <rect x="298" y="270" width="54" height="18" rx="9" fill="#f97316"/>
    <rect x="136" y="316" width="106" height="12" rx="6" fill="#334155"/>
    <rect x="136" y="342" width="196" height="10" rx="5" fill="#64748b"/>
    <rect x="136" y="366" width="152" height="10" rx="5" fill="#94a3b8"/>
    <rect x="312" y="318" width="56" height="56" rx="16" fill="#2563eb"/>
  </g>

  <circle cx="138" cy="140" r="15" fill="#ffffff" opacity="0.95"/>
  <path d="M242 112 H270 M256 98 V126" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M354 140 H394" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M374 120 V160" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
